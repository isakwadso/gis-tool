name: Build pasture layer

# Downloads Jordbruksverket's pasture blocks for the region in config.json and
# commits the simplified map files to site/data. Runs when the build script or
# config changes, once a year (new block data is published around year end),
# or manually from the Actions tab.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 15 2 *"   # 15 February, 04:37 UTC
  push:
    branches: [main]
    paths:
      - scripts/build_pasture.py
      - config.json
      - .github/workflows/pasture.yml

permissions:
  contents: read

concurrency:
  group: pasture
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to commit the rebuilt layer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "shapely>=2,<3" "pyproj>=3.6,<4"

      - name: Build pasture layer
        run: python scripts/build_pasture.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/cells.json site/data/pasture
          if git diff --cached --quiet; then
            echo "Pasture layer unchanged."
            exit 0
          fi
          git commit -m "Update pasture layer"
          git pull --rebase origin main
          git push origin HEAD:main

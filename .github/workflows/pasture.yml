name: Build pasture layer

# Downloads Jordbruksverket's pasture blocks and OpenStreetMap place names for the
# region in config.json and commits the map files to site/data. Runs when the build script or
# config changes, once a year (new block data is published around year end),
# or manually from the Actions tab.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 15 2 *"   # 15 February, 04:37 UTC
  push:
    branches: [main]
    paths:
      - scripts/build_pasture.py
      - scripts/build_places.py
      - config.json
      - .github/workflows/pasture.yml

permissions:
  contents: read

concurrency:
  group: pasture
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to commit the rebuilt layer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "shapely>=2,<3" "pyproj>=3.6,<4"

      - name: Build pasture layer
        run: python scripts/build_pasture.py

      - name: Build place names
        # Overpass is a shared free service; if it is busy, keep last year's names
        # rather than holding back the pasture update.
        continue-on-error: true
        run: python scripts/build_places.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/cells.json site/data/pasture
          if [ -f site/data/places.json ]; then git add site/data/places.json; fi
          if git diff --cached --quiet; then
            echo "Pasture layer unchanged."
            exit 0
          fi
          git commit -m "Update pasture layer and place names"
          git pull --rebase origin main
          git push origin HEAD:main

name: Build pasture layer

# Downloads Jordbruksverket's pasture blocks (only those that have been pasture for
# the last pasture.min_years yearly layers) and OpenStreetMap place names for the
# region in config.json and commits the map files to site/data. Runs when the build script or
# the region, pasture or grid settings in config.json change, once a year (new block
# data is published around year end), or manually from the Actions tab.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 15 2 *"   # 15 February, 04:37 UTC
  push:
    branches: [main]
    paths:
      - scripts/build_pasture.py
      - scripts/build_places.py
      - scripts/test_pasture.py
      - config.json
      - .github/workflows/pasture.yml

permissions:
  contents: read

concurrency:
  group: pasture
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # to commit the rebuilt layer
    steps:
      - uses: actions/checkout@v7

      # A push that only changes other settings in config.json (the weather model, the
      # rain view) needs no rebuild, which can take up to an hour: compare the settings
      # the layer is built from with those before the push.
      - id: need
        name: Check whether the pasture settings changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || ! git fetch -q --depth=1 origin "$BEFORE"; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git diff --quiet "$BEFORE" HEAD -- scripts/build_pasture.py scripts/build_places.py \
               scripts/test_pasture.py .github/workflows/pasture.yml; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git show "$BEFORE:config.json" > "$RUNNER_TEMP/old_config.json"
          python3 -c '
          import json, os, sys
          old = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "old_config.json")))
          new = json.load(open("config.json"))
          same = all(old.get(k) == new.get(k) for k in ("region", "pasture", "grid"))
          print("build=" + ("false" if same else "true"))
          ' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - if: steps.need.outputs.build == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.need.outputs.build == 'true'
        run: python -m pip install --disable-pip-version-check "shapely>=2,<3" "pyproj>=3.6,<4"

      - name: Test the pasture filter
        if: steps.need.outputs.build == 'true'
        run: python -m unittest discover -s scripts -p "test_pasture.py" -v

      - name: Build pasture layer
        if: steps.need.outputs.build == 'true'
        run: python scripts/build_pasture.py

      - name: Build place names
        # Overpass is a shared free service; if it is busy, keep last year's names
        # rather than holding back the pasture update.
        if: steps.need.outputs.build == 'true'
        continue-on-error: true
        run: python scripts/build_places.py

      - name: Commit if changed
        if: steps.need.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/cells.json site/data/pasture
          if [ -f site/data/places.json ]; then git add site/data/places.json; fi
          if git diff --cached --quiet; then
            echo "Pasture layer unchanged."
            exit 0
          fi
          git commit -m "Update pasture layer and place names"
          git pull --rebase origin main
          git push origin HEAD:main
